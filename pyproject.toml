[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maqsad"
version = "0.1.0"
description = "Arabic sarcasm and sentiment analysis with reproducible baselines and multi-task MARBERT fine-tuning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "joblib>=1.4", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
train = ["torch>=2.3", "transformers>=4.45,<5"]
dev = ["pytest>=8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]
app = ["streamlit>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
